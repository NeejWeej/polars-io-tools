# Single-node ClickHouse used by the integration tests in
# polars_io_tools/tests/integration. See that directory's README for how to run
# the tests against this service.
---
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: polars-io-tools-clickhouse
    ports:
      # HTTP interface. Bind to 127.0.0.1 (not 0.0.0.0) so the service is not
      # exposed off-host when developers run this locally.
      - "127.0.0.1:8123:8123"
    environment:
      # The `default` user with an empty password matches the test defaults
      # (CLICKHOUSE_URL=http://127.0.0.1:8123, CLICKHOUSE_USER=default).
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      # ClickHouse recommends a high nofile limit; the container logs a warning otherwise.
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # /ping returns "Ok." once the HTTP interface is accepting connections, so
      # `docker compose up --wait` blocks until the server is actually ready.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 10s
      retries: 24
